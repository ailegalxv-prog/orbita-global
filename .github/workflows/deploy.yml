# Статичний сайт global.orbita-ix.com: збірки немає, публікується корінь репозиторію.
# Взято з робочого деплою orbita-ix.com (landing/.github/workflows/deploy.yml).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Обовʼязкові файли на місці
        run: |
          for f in index.html amazon.html amazon-en.html CNAME img/logo-light.png img/symbol-light.png; do
            test -s "$f" || { echo "missing $f"; exit 1; }
          done
          grep -qx 'global.orbita-ix.com' CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
